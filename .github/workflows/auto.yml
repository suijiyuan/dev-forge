name: Auto

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）自动检查更新
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      check_vscode:
        description: "Check for a newer stable VS Code version"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Check updates without committing, tagging, or releasing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Check VS Code and extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      target_version: ${{ steps.check.outputs.target_version }}

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Dev Forge
        run: python -m pip install -e .

      - name: Check and apply updates
        id: check
        shell: bash
        env:
          CHECK_VSCODE: ${{ github.event_name == 'workflow_dispatch' && inputs.check_vscode == false && 'false' || 'true' }}
        run: |
          args=(--config packager.jsonc --auto-update --github-output "$GITHUB_OUTPUT")
          if [[ "$CHECK_VSCODE" == "false" ]]; then
            args+=(--no-vscode-update)
          fi
          dev-forge "${args[@]}"

      - name: Run tests and validate configuration
        if: steps.check.outputs.changed == 'true'
        run: |
          python -m unittest discover -s src/tests -v
          python -c 'from pathlib import Path; from dev_forge.core import collect_extension_ids, load_config, load_extension_lock; c=load_config(Path("packager.jsonc").resolve()); load_extension_lock(Path("packager.lock.json"), c.version, c.arch, collect_extension_ids(c))'

      - name: Commit and push to master
        id: commit
        if: steps.check.outputs.changed == 'true' && inputs.dry_run != true
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.check.outputs.commit_message }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- packager.jsonc packager.lock.json)" ]]; then
            echo "No git changes detected in packager.jsonc or packager.lock.json." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add packager.jsonc packager.lock.json
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    name: Validate updated commit
    needs: update
    if: needs.update.outputs.changed == 'true' && inputs.dry_run != true
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.update.outputs.sha }}

  tag:
    name: Tag validated commit
    needs: [update, ci]
    if: needs.update.outputs.changed == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.publish.outputs.tag }}

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.sha }}
          fetch-depth: 0

      - name: Create and push release tag
        id: publish
        shell: bash
        env:
          TARGET_VERSION: ${{ needs.update.outputs.target_version }}
          RELEASE_SHA: ${{ needs.update.outputs.sha }}
        run: |
          set -euo pipefail

          today="$(TZ=Asia/Shanghai date +%Y%m%d)"
          prefix="v${TARGET_VERSION}.${today}."
          max_seq=0
          while IFS= read -r existing_tag; do
            seq="${existing_tag#"$prefix"}"
            if [[ "$seq" =~ ^[0-9]+$ ]] && (( seq > max_seq )); then
              max_seq="$seq"
            fi
          done < <(git tag -l "${prefix}*")

          next_tag="${prefix}$((max_seq + 1))"
          git tag "$next_tag" "$RELEASE_SHA"
          git push origin "$next_tag"
          echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"

  release:
    name: Build ZIP and publish GitHub Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
